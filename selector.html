<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Selector de Fotos - Boda Herrera x Zavala</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/selector.css">
</head>
<body>
    <header class="header">
        <h1 class="main-title">Rebeca &amp; Alejandro</h1>
        <p class="subtitle">Boda Herrera x Zavala</p>
        <p class="instructions">Selecciona las fotos para impresión</p>
    </header>

    <div class="nav-links" style="display:flex;justify-content:center;gap:15px;margin:20px 0;flex-wrap:wrap;">
        <a href="contrato.html" style="display:inline-block;background:#1a2744;color:white;padding:10px 20px;border-radius:25px;text-decoration:none;">
            <i class="fas fa-file-contract"></i> Contrato
        </a>
        <a href="selector.html" style="display:inline-block;background:#c9a84c;color:white;padding:10px 20px;border-radius:25px;text-decoration:none;">
            <i class="fas fa-images"></i> Fotos
        </a>
    </div>

    <div class="container">
        <!-- Control Panel -->
        <div class="control-panel">
            <div class="stats-row">
                <div class="stat-card impresion">
                    <span class="stat-icon">📸</span>
                    <div class="stat-info">
                        <h3>Impresión</h3>
                        <span class="stat-count" id="countImpresion">0/50</span>
                    </div>
                </div>
                <div class="stat-card descartada">
                    <span class="stat-icon">❌</span>
                    <div class="stat-info">
                        <h3>Descartadas</h3>
                        <span class="stat-count" id="countDescartada">0</span>
                    </div>
                </div>
                <div class="stat-card sin-clasificar">
                    <span class="stat-icon">⭕</span>
                    <div class="stat-info">
                        <h3>Sin Clasificar</h3>
                        <span class="stat-count" id="countSinClasificar">0</span>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-filter active" id="btnFilterAll" data-filter="all">Todas</button>
                <button class="btn btn-filter filter-impresion" id="btnFilterImpresion" data-filter="impresion">Impresión</button>
                <button class="btn btn-filter filter-descartada" id="btnFilterDescartada" data-filter="descartada">Descartadas</button>
                <button class="btn btn-filter filter-sin-clasificar" id="btnFilterSinClasificar" data-filter="sin-clasificar">Sin Clasificar</button>
            </div>

            <div class="action-buttons secondary">
                <button class="btn btn-export" id="btnExport"><i class="fas fa-download"></i> Descargar Reporte</button>
                <button class="btn btn-share" id="btnShare"><i class="fas fa-copy"></i> Copiar Resumen</button>
                <button class="btn btn-clear" id="btnClear"><i class="fas fa-trash"></i> Limpiar Todo</button>
            </div>
        </div>

        <!-- Gallery -->
        <section class="gallery-section">
            <div class="photos-grid" id="photosGrid"></div>
        </section>
    </div>

    <!-- Modal -->
    <div class="modal" id="photoModal">
        <button class="modal-nav-btn modal-prev" id="btnPrevPhoto">&#10094;</button>
        <button class="modal-nav-btn modal-next" id="btnNextPhoto">&#10095;</button>

        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modalImage" src="" alt="Foto seleccionada">
                    <div class="modal-photo-number" id="modalPhotoNumber"></div>
                </div>
                <div class="modal-options">
                    <h3>Clasificar esta foto</h3>
                    <p class="modal-subtitle">Selecciona la categoría para esta imagen</p>
                    <div class="option-buttons">
                        <button class="option-btn impresion" data-category="impresion">
                            <span class="option-icon">📸</span>
                            <span class="option-text">Impresión (5x7)</span>
                            <span class="option-check">✓</span>
                        </button>
                        <button class="option-btn descartada" data-category="descartada">
                            <span class="option-icon">❌</span>
                            <span class="option-text">Descartar</span>
                            <span class="option-check">✓</span>
                        </button>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-cancel" id="btnCancelSelection">Cancelar</button>
                        <button class="btn btn-save" id="btnSaveSelection">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- DEBUG PANEL — borrar después de testear -->
    <div id="debugPanel" style="position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#0f0;font:12px monospace;padding:8px;z-index:99999;max-height:40vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
            <b style="color:#ff0">DEBUG</b>
            <button onclick="document.getElementById('debugPanel').style.display='none'" style="background:#f00;color:#fff;border:none;padding:2px 8px;border-radius:3px;">X</button>
        </div>
        <div id="dbgLazy">Lazy: queue=0 active=0 loaded=0 errors=0</div>
        <div id="dbgSW">SW: -</div>
        <div id="dbgNet">Net: -</div>
        <div id="dbgLog" style="color:#aaa;margin-top:4px;"></div>
    </div>
    <script>
    // Interceptar errores globales
    window.onerror = (msg, src, line) => dbgLog('ERROR: ' + msg + ' (' + src?.split('/').pop() + ':' + line + ')');
    window.addEventListener('unhandledrejection', e => dbgLog('REJECT: ' + e.reason));

    // SW status
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then(r => {
            document.getElementById('dbgSW').textContent = 'SW: ' + (r ? 'registrado (' + r.scope + ')' : 'ninguno');
        });
    }

    // Interceptar fetch para contar peticiones
    let netOk = 0, netErr = 0, netPending = 0;
    const origFetch = window.fetch;
    window.fetch = function(...args) {
        netPending++;
        updateNet();
        return origFetch.apply(this, args)
            .then(r => { netPending--; if(r.ok) netOk++; else netErr++; updateNet(); return r; })
            .catch(e => { netPending--; netErr++; updateNet(); throw e; });
    };
    function updateNet() {
        document.getElementById('dbgNet').textContent = `Net: ok=${netOk} err=${netErr} pending=${netPending}`;
    }

    // Log helper
    function dbgLog(msg) {
        const el = document.getElementById('dbgLog');
        el.innerHTML = msg + '<br>' + el.innerHTML;
        el.innerHTML = el.innerHTML.split('<br>').slice(0,8).join('<br>');
    }

    // Exponer función para actualizar stats del lazy loader
    window.updateDbgLazy = function(q, a, loaded, errors) {
        document.getElementById('dbgLazy').textContent = `Lazy: queue=${q} active=${a} loaded=${loaded} errors=${errors}`;
    };
    </script>

    <script src="js/selector.js"></script>
</body>
</html>
